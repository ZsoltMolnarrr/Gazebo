# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.1.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.1.2     multiple: minecraft_compat_versions=26.1:26.1.1:26.1.2
minecraft_compat_versions=26.1:26.1.1:26.1.2

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 26.1.2.94

# Mod
maven_group=net.rpg_series
archives_name=gazebo
mod_version=2.2.0.003

# Dependencies
fabric_api_version=0.155.2+26.1.2

tiny_config_version=4.0.0
structure_pool_api_version=1.3.1.001+26.1.2
spell_power_version=1.6.2.001+26.1.2

# Data-only dependency: Gazebo places `spell_engine:spell_binding` inside its structures, so
# SpellEngine is a hard runtime dependency even though no Java file references it. It must stay
# TRANSITIVE so its own hard deps (PAL, Cloth Config, Curios/Trinkets) land in the dev runtime
# (LESSONS 4.45) -- that is also why this repo declares none of them itself.
spell_engine_version=1.10.5.002+26.1.2

# PAL is only ever a *transitive* dependency here (Gazebo has no animation code), but it stays
# pinned explicitly: SpellEngine's `neoforge.mods.toml` requires `player_animation_library [1.2.6,)`
# (LESSONS 1.21.11 4.52), and that range lives in a resource file, not in the dependency graph --
# nothing in the build would catch a transitive downgrade.
player_anim_version=1.2.6+mc.26.1
