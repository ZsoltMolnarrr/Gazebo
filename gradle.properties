# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
yarn_mappings_patch_neoforge_version = 1.21+build.6
minecraft_compat_version=1.21.11

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.3
neoforge_version = 21.11.45

# Mod
maven_group=net.rpg_series
archives_name=gazebo
mod_version=2.2.0

# Dependencies
fabric_api_version=0.141.6+1.21.11

tiny_config_version=3.1.1
structure_pool_api_version=1.3.0.001+1.21.11
spell_power_version=1.7.0.001+1.21.11

# Data-only dependency: Gazebo places `spell_engine:spell_binding` inside its structures, so
# SpellEngine is a hard runtime dependency even though no Java file references it. It must stay
# TRANSITIVE so its own hard deps (PAL, Cloth Config, Curios/Trinkets) land in the dev runtime
# (LESSONS 4.45) -- that is also why this repo declares none of them itself.
spell_engine_version=1.11.0.022+1.21.11
