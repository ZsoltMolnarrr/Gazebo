architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/).

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}")

    // StructurePoolAPI is NOT on the common classpath: the only 1.20.1 artifact is Fabric-only, so
    // both the API calls and the `config/gazebo/villages.json` config live in the fabric module,
    // behind the `net.gazebo.village.VillageStructures` seam.
    // SpellEngine is a pure *data* dependency here (the structures place `spell_engine:spell_binding`),
    // so it is not on the compile classpath either.
}
