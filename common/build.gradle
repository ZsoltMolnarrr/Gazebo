architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/).

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}")

    // StructurePoolAPI 1.2.1+ ships a Forge artifact too, and its `injectAll` touches no loader API,
    // so the village injection and the `config/gazebo/villages.json` config live here in `common`.
    // The `-common` artifact carries the whole API surface and no loader dependency. NOT JiJ'd: it is
    // a standalone library mod the player installs.
    modImplementation("net.foundation:structure_pool_api-common:${rootProject.structure_pool_api_version}")

    // SpellEngine is a pure *data* dependency here (the structures place `spell_engine:spell_binding`),
    // so it is not on the compile classpath.
}
