plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    neoForge()
}

// No `common/src/main/generated` resources srcDir: Gazebo has no datagen providers, and the
// `configureDataGeneration` block that used to fill that dir (with EVERY dependency's datagen
// output -- LESSONS 1.21.11 4.55) has been removed from `fabric/build.gradle`. Keeping the srcDir
// would only ever package foreign data into our jar.

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://repo.redlance.org/public' } // PAL (Player Animation Library), via SpellEngine
    maven { url = 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    // For Curios
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    include(implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))

    // Pinned explicitly even though Gazebo has no animation code: SpellEngine's NeoForge manifest
    // requires `player_animation_library [1.2.6,)` (LESSONS 1.21.11 4.52), so the dev runtime must
    // have that version on the classpath regardless of what conflict resolution picks transitively.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${project.player_anim_version}")

    implementation("net.rpg_foundation:structure_pool_api-${platform}:${project.structure_pool_api_version}")
//    implementation("maven.modrinth:structure-pool-api:${project.structure_pool_api_version}-${platform}")
    implementation("net.spell_power:spell_power-${platform}:${project.spell_power_version}")
//    implementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}")

    // SpellEngine: data-only (the `spell_engine:spell_binding` block inside the structure NBTs),
    // but a HARD dependency of the shipped mod, so the dev runtime needs it.
    // NB: the Modrinth artifact carries no pom, so nothing comes along transitively. SpellEngine's
    // own hard deps that Gazebo does not declare itself (Cloth Config, Curios, RangedWeaponAPI)
    // are therefore absent from the dev runtime, and `runClient` fails mod resolution before the
    // game starts (LESSONS 4.45). Compilation and the shipped jar are unaffected. Switch to the
    // commented mavenLocal line below (whose pom IS transitive) to boot the dev runtime.
    implementation("net.spell_engine:spell_engine-${platform}:${project.spell_engine_version}")
//    implementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}")
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_min_version', rootProject.minecraft_min_version

    filesMatching('META-INF/neoforge.mods.toml') {
        def cleanedProps = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        cleanedProps.minecraft_min_version = rootProject.minecraft_min_version
        expand(cleanedProps)
    }
}

// 26.1+ is unobfuscated: no remapJar, the shadow jar is the final artifact.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    // Build on top of the `jar` task output instead of raw source-set outputs:
    // in no-remap Loom the jar-in-jar nesting (`include`) is applied by `jar`
    // (it was applied by the old remap step after shadowing, before 26.1).
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

// Publish the SHADED jar as the main artifact (nothing else takes that role any more).
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// Publishing is configured unconditionally: tasks only *run* when explicitly invoked
// (e.g. `publishMod` in CI), and all credentials are lazy env providers, so a local
// `build` — with none of the tokens present — is completely unaffected.
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = shadowJar.archiveFile         // the shipped (shaded, jar-in-jar) artifact
    changelog = providers.provider { changelog_last_section() }   // lazy: read only at publish
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"   // per-loader suffix → unique Modrinth version
    displayName = "${project.version}"
    modLoaders.add("neoforge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")   // numeric id
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.addAll(rootProject.minecraftCompatVersions)
        client = true                    // >=1 of client/server REQUIRED by CurseForge (Error 1021)
        server = true
        changelogType = "markdown"
        requires("structure-pool-api")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.SERVER_ONLY
        projectId = providers.environmentVariable("MODRINTH_PROJECT_RAW_ID")
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.addAll(rootProject.minecraftCompatVersions)
        requires { slug = "structure-pool-api" }
    }

    // Each platform publishes its own GitHub release under a distinct, platform-suffixed
    // tag (e.g. `1.0.0+1.21.1-neoforge`), so the two publish jobs don't collide.
    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        // `commitish` is REQUIRED by the plugin. GITHUB_SHA is set automatically by GitHub
        // Actions to the triggering commit — valid even in a detached-HEAD checkout.
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
